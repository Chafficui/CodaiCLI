[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codaicli"
version = "1.0.0"
description = "AI-powered agentic CLI assistant for code projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Felix Beinssen", email = "codaicli.wrist796@passmail.net"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "litellm>=1.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=0.19.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
all = ["mcp>=1.0"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21",
]

[project.scripts]
codaicli = "codaicli.cli:cli"

[project.urls]
Homepage = "https://github.com/chafficui/CodaiCLI"
Repository = "https://github.com/chafficui/CodaiCLI"
Issues = "https://github.com/chafficui/CodaiCLI/issues"

[tool.setuptools.packages.find]
include = ["codaicli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=codaicli --cov-report=term-missing"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
